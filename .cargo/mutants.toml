# cargo-mutants: `cargo mutants --package oas-forge --test-tool nextest`
# https://mutants.rs
#
# Mutants that cannot change observable behaviour (or need the process's
# working directory), each with the reason.
exclude_re = [
    # Delegates to `load_from(".")`; testing it would change the working
    # directory of the whole test process. `load_from` is tested.
    "replace Config::load -> ",
    # Reads `OUT_DIR`, which only build scripts have; changing the process
    # environment in tests is unsound. The examples job covers it.
    "replace Package::from_build_env -> ",
    # `#[serde(other)]` only changes deserialization (unknown tags); the
    # serialized form, which schemas describe, is the variant's own name.
    "delete match arm \"other\" in SerdeAttrs::flag",
    # YAML positions are 1-based; a line 0 never occurs.
    "src/yaml.rs:.*replace > with >= in parse",
    # Fast path and whitespace tidying of `to_string`: every candidate result
    # is checked by parsing it back, so these only change which equivalent
    # text is written for lines that hold nothing but spaces.
    "src/yaml.rs:.*in to_string",
    # Fast paths: without parameters or `{{`, and for strings without an
    # escaped dollar, the full pass returns the same text.
    "src/template/lexical.rs:.*replace \\|\\| with && in substitute_params",
    "src/template/refs.rs:.*replace match guard s.contains\\(ESCAPED_DOLLAR\\) with true in unescape_at",
    # A smart reference handed back as a "built-in" is resolved again right
    # after, as a name; the result is the same pointer.
    "src/template/refs.rs:.*replace match guard !map\\s*\\.get\\(\"\\$ref\"\\).* with true in builtin",
    # A nullable reference merged into its parent is turned into `allOf` by
    # the reference-sibling rule right after; the result is the same.
    "src/schema/dialect.rs:.*replace match guard inner.contains_key\\(\"\\$ref\"\\) with false in lower_30",
    # Fast path: `GenericRef::parse` rejects every string that does not
    # start with `$` or has no `<`, so the guard only saves the parse.
    "src/template/generics.rs:.*replace match guard s.starts_with\\('\\$'\\) && s.contains\\('<'\\) with true in Instantiator<'a>::apply",
    "src/template/generics.rs:.*replace && with \\|\\| in Instantiator<'a>::apply",
    # Without the parsed tree, the file is parsed again by `extract`: the
    # same items, only a second parse.
    "src/generator.rs:.*delete match arm Some\\(\\(_, Some\\(ast\\)\\)\\) in prepare",
    # Any empty set is the same empty set of documented names.
    "src/template/refs.rs:.*replace KnownSchemas::none -> &'static Self with Box::leak",
]
