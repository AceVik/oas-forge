# cargo-mutants: `cargo mutants --package oas-forge --test-tool nextest`
# https://mutants.rs
#
# Mutants that cannot change observable behaviour (or need the process's
# working directory), each with the reason.
exclude_re = [
    # `persist_retrying` is compiled on Windows only, so mutating it cannot
    # change what tests elsewhere see. The Windows CI job runs
    # `concurrent_writers_publish_complete_documents`, which needs it.
    "src/output/mod.rs:.*persist_retrying",
    # A larger read limit only reads more of an outdated output: every
    # current one, `\r\n` endings included, fits the exact limit.
    "src/output/mod.rs:.*replace \\+ with \\* in is_current",
    # The early variable-size check avoids allocating an oversized quoted
    # string. `append_bounded` independently checks the final length, so
    # relaxing this precheck cannot change text or diagnostics.
    "src/template/lexical.rs:.*replace - with \\+ in substitute_line",
    # Delegates to `load_from(".")`; testing it would change the working
    # directory of the whole test process. `load_from` is tested.
    "replace Config::load -> ",
    # Reads `OUT_DIR`, which only build scripts have; changing the process
    # environment in tests is unsound. The examples job covers it.
    "replace Package::from_build_env -> ",
    # `#[serde(other)]` only changes deserialization (unknown tags); the
    # serialized form, which schemas describe, is the variant's own name.
    "delete match arm \"other\" in SerdeAttrs::flag",
    # YAML positions are 1-based; a line 0 never occurs.
    "src/yaml.rs:.*replace > with >= in parse",
    # Fast path and whitespace tidying of `to_string`: every candidate result
    # is checked by parsing it back, so these only change which equivalent
    # text is written for lines that hold nothing but spaces.
    "src/yaml.rs:.*in to_string",
    # Fast paths: without parameters or `{{`, and for strings without an
    # escaped dollar, the full pass returns the same text.
    "src/template/lexical.rs:.*replace \\|\\| with && in substitute_params",
    "src/template/refs.rs:.*replace match guard s.contains\\(ESCAPED_DOLLAR\\) with true in unescape_at",
    # A smart reference handed back as a "built-in" is resolved again right
    # after, as a name; the result is the same pointer.
    "src/template/refs.rs:.*replace match guard !map\\s*\\.get\\(\"\\$ref\"\\).* with true in builtin",
    # A nullable reference merged into its parent is turned into `allOf` by
    # the reference-sibling rule right after; the result is the same.
    "src/schema/dialect.rs:.*replace match guard inner.contains_key\\(\"\\$ref\"\\) with false in lower_30",
    # Fast path: `GenericRef::parse` rejects every string that does not
    # start with `$` or has no `<`, so the guard only saves the parse.
    "src/template/generics.rs:.*replace match guard s.starts_with\\('\\$'\\) && s.contains\\('<'\\) with true in Instantiator<'a>::apply",
    "src/template/generics.rs:.*replace && with \\|\\| in Instantiator<'a>::apply",
    # Without the parsed tree, the file is parsed again by `extract`: the
    # same items, only a second parse.
    "src/generator.rs:.*delete match arm Some\\(\\(_, Some\\(ast\\)\\)\\) in prepare",
    # Any empty set is the same empty set of documented names.
    "src/template/refs.rs:.*replace KnownSchemas::none -> &'static Self with Box::leak",
    # The built-in type table is the empty mapper; a leaked default is equal.
    "src/schema/types.rs:.*replace TypeMapper::builtin -> &'static Self with Box::leak",
    # The class digit of a status code only orders the classes; an offset
    # (`+ b'0'` instead of `- b'0'`) keeps their order.
    "src/generator.rs:.*replace - with \\+ in status_rank",
    # `crate`, `self` and `super` after other segments (`a::crate::B`) do
    # not compile, and `self` in a `use` group is read before `step`: only
    # the first segment of a path can be such a keyword.
    "src/extract/names.rs:.*replace match guard at_start with true in step",
    "src/extract/names.rs:.*replace && with \\|\\| in step",
    "src/extract/names.rs:.*replace match guard at_start \\|\\| path.keywords with true in step",
    # A one-character key cannot hold whitespace: whether `"` or `'` alone
    # counts as quoted does not change the result.
    "src/dsl/prose.rs:.*replace > with >= in continues_mapping",
    # The guard admits exactly the extractors the `match` after it reads; any
    # other `Option<T>` argument is ignored with or without unwrapping.
    "src/extract/signature.rs:.*replace match guard matches!\\( inner.name\\(\\), .* with true in infer",
    # `@route` sets the method together with a non-empty path and `@webhook`
    # with the name, so an empty method alone means "no valid header".
    "src/dsl/mod.rs:.*replace \\|\\| with && in Compiler<'_, '_>::finish",
    # A bare name of `SHADOWABLE` always reaches a built-in arm of
    # `map_named`; whether to resolve the name by its module only matters
    # for names that are not built in.
    "src/schema/types.rs:.*delete ! in TypeMapper::map",
    # The count check only saves building the `formData` parameters of a
    # form that the size check while building rejects anyway: each costs
    # at least `PARAMETER_COST`, and its text is never empty.
    "src/output/swagger2.rs:.*replace Converter::form_may_fit -> bool with true",
    "src/output/swagger2.rs:.*replace <= with < in Converter::form_may_fit",
]
