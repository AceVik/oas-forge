[workspace]
members = ["crates/oas-forge-cli"]
exclude = ["examples"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
authors = ["Viktor Machnik <viktor@machnik.de>"]
license = "MIT"
repository = "https://github.com/AceVik/oas-forge"
homepage = "https://github.com/AceVik/oas-forge"

# Only the `oas-forge` binary is built with this profile: libraries are
# compiled with the profile of the crate that uses them.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[package]
name = "oas-forge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "OpenAPI 3.2/3.1/3.0 and Swagger 2.0 generator for Rust: API docs from serde types, doc comments and axum/actix-web handlers at build time. Also JSON Schema and AsyncAPI. No macros, no runtime."
documentation = "https://docs.rs/oas-forge"
readme = "README.md"
keywords = ["openapi", "swagger", "json-schema", "asyncapi", "axum"]
categories = ["web-programming::http-server", "development-tools::build-utils", "web-programming", "development-tools"]
# An allowlist, so local files never end up in the published crate.
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/CHANGELOG.md", "/SECURITY.md"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
# Lower bounds are the tested versions; CI checks them with
# `-Z direct-minimal-versions`.
syn = { version = "3.0.9", features = ["full", "visit"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
serde = { version = "1.0.229", features = ["derive"] }
# YAML is only touched by src/yaml.rs (ADR 0009).
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize", "serialize"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
walkdir = "2.5.0"
toml = "1.1.8"
regex = "1.13.1"

[dev-dependencies]
insta = { version = "1.49.0", features = ["json", "glob"] }
jsonschema = { version = "0.59.0", default-features = false }
proptest = "1.12.0"
tempfile = "3.27.0"
# The README examples compile against the real crate (doctests).
validator = { version = "0.21.0", features = ["derive"] }
