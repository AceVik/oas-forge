[package]
name = "oas-forge"
version = "0.1.4"
edition = "2024"
rust-version = "1.85"
authors = ["Viktor Machnik <viktor@machnik.de>"]
description = "The zero-runtime OpenAPI 3.1 compiler for Rust. Extracts, links, and merges code-first documentation."
license = "MIT"
readme = "README.md"
repository = "https://github.com/AceVik/oas-forge"
documentation = "https://docs.rs/oas-forge"
homepage = "https://github.com/AceVik/oas-forge"

keywords = ["openapi", "compile-time", "generator", "documentation", "build-script"]
categories = ["development-tools", "web-programming", "development-tools::build-utils", "api-bindings"]

exclude = [
    ".github",
    ".gitignore",
    "tests",
    "static",
    "examples",
    "AGENTS.md"
]

[dependencies]
# CORE LOGIC
syn = { version = "3", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1.0"
walkdir = "2.5"
thiserror = "2.0"
toml = "1.0"
log = "0.4"
regex = "1.13"

# CLI FEATURES
clap = { version = "4.6", features = ["derive"], optional = true }
anyhow = { version = "1.0", optional = true }
colored = { version = "3.1", optional = true }
env_logger = { version = "0.11", optional = true }

[features]
default = ["cli"]
cli = ["dep:clap", "dep:anyhow", "dep:colored", "dep:env_logger"]

[[bin]]
name = "oas-forge"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
path = "tests/cli/main.rs"
required-features = ["cli"]

[dev-dependencies]
env_logger = "0.11"
insta = { version = "1.49", features = ["json", "glob"] }
jsonschema = { version = "0.59", default-features = false }
proptest = "1.12"
tempfile = "3.27"
