[workspace]
members = ["crates/oas-forge-cli"]
exclude = ["examples"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Viktor Machnik <viktor@machnik.de>"]
license = "MIT"
repository = "https://github.com/AceVik/oas-forge"
homepage = "https://github.com/AceVik/oas-forge"

[package]
name = "oas-forge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The zero-runtime OpenAPI 3.1 compiler for Rust. Extracts, links, and merges code-first documentation."
documentation = "https://docs.rs/oas-forge"
readme = "README.md"
keywords = ["openapi", "compile-time", "generator", "documentation", "build-script"]
categories = ["development-tools", "web-programming", "development-tools::build-utils", "api-bindings"]
exclude = [
    ".github",
    ".gitignore",
    "tests",
    "static",
    "examples",
    "crates",
    "docs",
    "AGENTS.md",
    "deny.toml",
]

[dependencies]
syn = { version = "3", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1.0"
walkdir = "2.5"
thiserror = "2.0"
toml = "1.0"
log = "0.4"
regex = "1.13"

[dev-dependencies]
env_logger = "0.11"
insta = { version = "1.49", features = ["json", "glob"] }
jsonschema = { version = "0.59", default-features = false }
proptest = "1.12"
tempfile = "3.27"
