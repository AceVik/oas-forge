[workspace]
members = ["crates/oas-forge-cli"]
exclude = ["examples"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
authors = ["Viktor Machnik <viktor@machnik.de>"]
license = "MIT"
repository = "https://github.com/AceVik/oas-forge"
homepage = "https://github.com/AceVik/oas-forge"

[package]
name = "oas-forge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Compile-time OpenAPI for Rust: OpenAPI 3.2/3.1/3.0, Swagger 2.0, JSON Schema and AsyncAPI from your code and doc comments, without macros or runtime cost."
documentation = "https://docs.rs/oas-forge"
readme = "README.md"
keywords = ["openapi", "compile-time", "generator", "documentation", "build-script"]
categories = ["development-tools", "web-programming", "development-tools::build-utils", "api-bindings"]
# An allowlist, so local files never end up in the published crate.
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/CHANGELOG.md", "/SECURITY.md"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
syn = { version = "3", features = ["full", "visit"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
# YAML is only touched by src/yaml.rs (ADR 0009).
serde-saphyr = { version = "2.0", default-features = false, features = ["deserialize", "serialize"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
walkdir = "2.5"
toml = "1.0"
regex = "1.13"

[dev-dependencies]
insta = { version = "1.49", features = ["json", "glob"] }
jsonschema = { version = "0.59", default-features = false }
proptest = "1.12"
tempfile = "3.27"
