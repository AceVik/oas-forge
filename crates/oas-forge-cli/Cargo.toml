[package]
name = "oas-forge-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "OpenAPI 3.2/3.1/3.0, Swagger 2.0, JSON Schema and AsyncAPI documents from Rust source code, on the command line. The CLI of oas-forge."
documentation = "https://docs.rs/oas-forge-cli"
readme = "README.md"
keywords = ["openapi", "swagger", "cli", "json-schema", "asyncapi"]
categories = ["command-line-utilities", "development-tools", "web-programming"]
# An allowlist, so local files never end up in the published crate. LICENSE
# is a copy of the workspace license (a crate ships its own).
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE"]

[[bin]]
name = "oas-forge"
path = "src/main.rs"
# The binary has no API of its own; its docs would collide with the library's.
doc = false

[dependencies]
# Lower bounds are the tested versions (see the root manifest).
oas-forge = { path = "../..", version = "0.2.0" }
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
serde_json = "1.0.154"

[dev-dependencies]
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
tempfile = "3.27.0"

# `cargo binstall oas-forge-cli` downloads the archives of the release workflow.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/oas-forge-v{ version }-{ target }{ archive-suffix }"
bin-dir = "oas-forge-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
