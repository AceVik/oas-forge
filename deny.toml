# cargo-deny policy: `cargo deny check`
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Every RUSTSEC advisory (vulnerable, unsound, unmaintained, yanked) fails the
# check. Exceptions must be listed here with a reason and a removal plan.
version = 2
yanked = "deny"
ignore = [
    # unsafe-libyaml is unmaintained; pulled in by serde_yaml_ng. Removed when
    # the YAML backend is replaced by serde-saphyr (refactor phase 5).
    { id = "RUSTSEC-2024-0449", reason = "replaced in refactor phase 5" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The allow list is a policy, not an inventory.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
