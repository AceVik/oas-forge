openapi: "3.1.0"
info:
  title: Microservice API
  version: "1.0.0"
  description: Example microservice demonstrating cross-crate template transport
paths:
  /users:
    get:
      summary: List all users with pagination
      operationId: list_users
      tags:
      - Users
      parameters: []
      responses:
        "200":
          description: Paginated list of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paginated_User"
components:
  schemas:
    Paginated_User:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
          format: int64
          minimum: 0
        page:
          type: integer
          format: int64
          minimum: 0
      required:
      - items
      - total
      - page
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 0
        name:
          type: string
      required:
      - id
      - name
