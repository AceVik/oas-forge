version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/examples"]
    schedule:
      interval: weekly
    # New releases wait a week: time for the ecosystem to catch a bad one.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo:
        update-types: [minor, patch]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
