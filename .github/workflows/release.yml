name: Release

# Pushing a version tag (`v0.2.0`) releases both crates of the workspace:
#
#   verify   the tag is the workspace version, it is on `main`, the CI run of
#            that commit on `main` succeeded, the changelog has the section,
#            both crates package (dry run)
#   build    the CLI binary for six targets, with build provenance
#   publish  `oas-forge`, then `oas-forge-cli` to crates.io (trusted
#            publishing; versions already on crates.io are skipped)
#   release  the GitHub release with the binaries, SHA256SUMS and the notes
#            of the changelog section
#
# One-time setup (see CONTRIBUTING.md, "Releasing"): a `crates-io` environment
# that only `v*` tags may deploy to, and this repository, this workflow and
# that environment as trusted publisher of both crates on crates.io. A crate's
# first release cannot use trusted publishing; for it, store a crates.io token
# limited to `publish-new` of that crate as the environment secret
# `CRATES_IO_BOOTSTRAP_TOKEN`, and delete it after that release.
#
# No caches here: a release is built from a clean state only.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.2.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # Includes up to an hour of waiting for the CI run of the tagged commit.
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read # finds the CI run of the tagged commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: The tag matches the workspace version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "oas-forge") | .version')"
          if [[ "v$version" != "$TAG" ]]; then
            echo "::error::tag $TAG does not match version $version"
            exit 1
          fi
      - name: The tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG ($(git rev-parse --short HEAD)) is not on main"
            exit 1
          fi
      - name: CHANGELOG.md has a section for the version
        run: |
          if ! grep -q "^## \[${TAG#v}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section ## [${TAG#v}]"
            exit 1
          fi
      # The full CI (tests on three systems, MSRV, lints, docs, coverage, …)
      # ran for this commit when it was pushed to main; wait for it.
      - name: CI passed for the tagged commit on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          deadline=$(( $(date +%s) + 3600 ))
          while :; do
            run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --branch main --event push --commit "$sha" --limit 1 \
              --json status,conclusion,url --jq '.[0] // empty')"
            if [[ -n "$run" && "$(jq -r .status <<<"$run")" == completed ]]; then
              conclusion="$(jq -r .conclusion <<<"$run")"
              url="$(jq -r .url <<<"$run")"
              if [[ "$conclusion" == success ]]; then
                echo "CI passed: $url"
                exit 0
              fi
              echo "::error::CI on main ended with '$conclusion' for $sha: $url"
              exit 1
            fi
            if (( $(date +%s) > deadline )); then
              echo "::error::no finished CI run on main for $sha within an hour"
              exit 1
            fi
            sleep 60
          done
      - name: Both crates package and build as published
        run: cargo publish --workspace --dry-run --locked
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-about@0.9.2
      - name: Third-party notices of the binary
        run: >-
          cargo about generate --locked
          -c .github/licenses/about.toml
          --manifest-path crates/oas-forge-cli/Cargo.toml
          .github/licenses/about.hbs -o THIRD-PARTY-LICENSES.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-licenses
          path: THIRD-PARTY-LICENSES.md

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # signs the build provenance attestation
      attestations: write # stores that attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, musl: true }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p oas-forge-cli --target "$TARGET"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-licenses
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="oas-forge-${TAG}-${TARGET}"
          mkdir "$name"
          cp README.md LICENSE CHANGELOG.md THIRD-PARTY-LICENSES.md "$name/"
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/oas-forge.exe" "$name/"
            7z a "$name.zip" "$name" >/dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            cp "target/$TARGET/release/oas-forge" "$name/"
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  # crates.io cannot be undone, so it comes only after every binary built.
  publish:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: read
      id-token: write # exchanged for a crates.io token (trusted publishing)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # A short-lived token for the crates whose trusted publisher is this
      # workflow; it is revoked when the job ends.
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # The library first: the CLI depends on it. Safe to re-run: versions
      # already on crates.io are skipped. A crate that exists is published
      # through trusted publishing only; the bootstrap token, if any, is used
      # for the first release of a new crate and nothing else.
      - name: Publish oas-forge, then oas-forge-cli
        env:
          TRUSTED_TOKEN: ${{ steps.auth.outputs.token }}
          BOOTSTRAP_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
        run: |
          version="${TAG#v}"
          api="https://crates.io/api/v1/crates"
          agent="oas-forge release workflow (github.com/$GITHUB_REPOSITORY)"
          for crate in oas-forge oas-forge-cli; do
            if curl -fsS -o /dev/null -A "$agent" "$api/$crate/$version"; then
              echo "$crate $version is already on crates.io"
            elif curl -fsS -o /dev/null -A "$agent" "$api/$crate"; then
              CARGO_REGISTRY_TOKEN="$TRUSTED_TOKEN" cargo publish --locked -p "$crate"
            elif [[ -n "$BOOTSTRAP_TOKEN" ]]; then
              echo "First release of $crate: publishing with the bootstrap token"
              CARGO_REGISTRY_TOKEN="$BOOTSTRAP_TOKEN" cargo publish --locked -p "$crate"
            else
              echo "::error::$crate is not on crates.io yet; its first release needs the environment secret CRATES_IO_BOOTSTRAP_TOKEN"
              exit 1
            fi
          done

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # creates the release and uploads its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      # The archives of every target and THIRD-PARTY-LICENSES.md.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - name: Release notes from the changelog
        run: |
          # The section `## [x.y.z] …` up to the next `## [`.
          awk -v version="${TAG#v}" '
            /^## \[/ { section = index($0, "## [" version "]") == 1; next }
            section
          ' CHANGELOG.md > notes.md
      # Safe to re-run: an existing release gets its assets replaced.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            prerelease=()
            if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$TAG" --notes-file notes.md "${prerelease[@]}"
          fi
